name: desktop

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'frontend/**'
      - '.github/workflows/desktop.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Dipendenze Linux per Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Genera icone dal logo approvato
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@^2 icon app-icon.png

      - name: Build desktop (frontend + bundle Tauri)
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@^2 build

      - name: Smoke test - avvio e render su Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick x11-utils openbox dbus-x11
          APPIMAGE=$(readlink -f "$(ls desktop/target/release/bundle/appimage/*.AppImage | head -1)")
          chmod +x "$APPIMAGE"
          cd /tmp && "$APPIMAGE" --appimage-extract >/dev/null
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          DISPLAY=:99 openbox > /tmp/openbox.log 2>&1 &
          sleep 2
          DISPLAY=:99 dbus-run-session -- env WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 NO_AT_BRIDGE=1 GDK_BACKEND=x11 RUST_LOG=info /tmp/squashfs-root/AppRun > /tmp/atlas-app.log 2>&1 &
          APP_PID=$!
          echo "--- attesa finestra ATLAS dimensionata (max 60s):"
          FOUND=0
          for i in $(seq 1 30); do
            WID=$(DISPLAY=:99 xwininfo -root -children | grep -i atlas | grep -oE '0x[0-9a-f]+' | head -1)
            if [ -n "$WID" ]; then
              W=$(DISPLAY=:99 xwininfo -id "$WID" 2>/dev/null | awk '/Width:/{print $2}')
              H=$(DISPLAY=:99 xwininfo -id "$WID" 2>/dev/null | awk '/Height:/{print $2}')
              echo "  finestra $WID ${W}x${H}"
              if [ "${W:-0}" -ge 400 ] && [ "${H:-0}" -ge 300 ]; then FOUND=1; break; fi
            fi
            sleep 2
          done
          if [ "$FOUND" = "1" ]; then
            echo "--- finestra trovata, attesa render (10s)"
            sleep 10
          fi
          DISPLAY=:99 import -window root /tmp/atlas-desktop-smoke.png || true
          STATS=$(identify -format "mean=%[mean] stddev=%[standard-deviation] size=%wx%h" /tmp/atlas-desktop-smoke.png 2>/dev/null || echo "n/a")
          echo "--- statistiche pixel: $STATS"
          {
            echo "esito: $([ "$FOUND" = "1" ] && echo finestra-trovata || echo NESSUNA-FINESTRA)"
            echo "pixel: $STATS"
            echo "--- finestre X (xwininfo -root -children):"
            DISPLAY=:99 xwininfo -root -children 2>&1 | tail -15
            echo "--- processi app/webkit:"
            ps aux | grep -iE 'apprun|webkit|atlas' | grep -v grep || echo "(nessuno)"
            echo "--- log app (stdout+stderr):"
            cat /tmp/atlas-app.log
            echo "--- log openbox:"
            cat /tmp/openbox.log 2>/dev/null || true
          } > /tmp/atlas-desktop-smoke.log 2>&1
          kill $APP_PID 2>/dev/null || true
          if [ "$FOUND" != "1" ]; then
            echo "ERRORE: nessuna finestra ATLAS dimensionata >=400x300 dopo 60s (vedi docs/assets/desktop-smoke-log.txt)"
            exit 1
          fi
          STDDEV=$(echo "$STATS" | sed -E 's/.*stddev=([0-9.]+).*/\1/')
          awk -v s="$STDDEV" 'BEGIN{ if (s+0 < 1.0) { print "ERRORE: screenshot vuoto/uniforme (stddev=" s ") - render non dimostrato (vedi docs/assets/desktop-smoke-log.txt)"; exit 1 } }'
          echo "OK: render dimostrato (stddev=$STDDEV)"

      - name: Salva lo screenshot smoke in docs/ (evidenza render nel repo)
        if: runner.os == 'Linux' && always()
        run: |
          mkdir -p docs/assets
          [ -f /tmp/atlas-desktop-smoke.png ] && cp /tmp/atlas-desktop-smoke.png docs/assets/desktop-smoke-linux.png
          [ -f /tmp/atlas-desktop-smoke.log ] && cp /tmp/atlas-desktop-smoke.log docs/assets/desktop-smoke-log.txt
          git config user.name "atlas-ci"
          git config user.email "ci@fredrichlabs.invalid"
          git add -A docs/assets/
          git commit -m "ci: screenshot smoke desktop (render Xvfb) [skip ci]" || echo "nessuna modifica"
          git push

      - name: Artifact smoke screenshot
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-desktop-smoke-linux
          path: |
            /tmp/atlas-desktop-smoke.png
            /tmp/atlas-desktop-smoke.log
          if-no-files-found: warn

      - name: Artifact Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-desktop-linux
          path: |
            desktop/target/release/bundle/deb/*.deb
            desktop/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

      - name: Artifact macOS
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-desktop-macos
          path: desktop/target/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
