name: desktop

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'frontend/**'
      - '.github/workflows/desktop.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Dipendenze Linux per Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Genera icone dal logo approvato
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@^2 icon app-icon.png

      - name: Build desktop (frontend + bundle Tauri)
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@^2 build

      - name: Smoke test - avvio e render su Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick x11-utils
          APPIMAGE=$(readlink -f "$(ls desktop/target/release/bundle/appimage/*.AppImage | head -1)")
          chmod +x "$APPIMAGE"
          cd /tmp && "$APPIMAGE" --appimage-extract >/dev/null
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          DISPLAY=:99 /tmp/squashfs-root/AppRun &
          APP_PID=$!
          sleep 25
          echo "--- finestre aperte:"
          DISPLAY=:99 xwininfo -root -children | grep -i atlas || echo "NESSUNA FINESTRA ATLAS"
          DISPLAY=:99 import -window root /tmp/atlas-desktop-smoke.png
          echo "--- statistiche pixel (stddev > 0 = render non vuoto):"
          identify -format "mean=%[mean] stddev=%[standard-deviation] size=%wx%h\n" /tmp/atlas-desktop-smoke.png
          kill $APP_PID || true

      - name: Salva lo screenshot smoke in docs/ (evidenza render nel repo)
        if: runner.os == 'Linux'
        run: |
          mkdir -p docs/assets
          cp /tmp/atlas-desktop-smoke.png docs/assets/desktop-smoke-linux.png
          git config user.name "atlas-ci"
          git config user.email "ci@fredrichlabs.invalid"
          git add docs/assets/desktop-smoke-linux.png
          git commit -m "ci: screenshot smoke desktop (render Xvfb) [skip ci]" || echo "nessuna modifica"
          git push

      - name: Artifact smoke screenshot
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-desktop-smoke-linux
          path: /tmp/atlas-desktop-smoke.png
          if-no-files-found: error

      - name: Artifact Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-desktop-linux
          path: |
            desktop/target/release/bundle/deb/*.deb
            desktop/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

      - name: Artifact macOS
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-desktop-macos
          path: desktop/target/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
