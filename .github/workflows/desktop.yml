name: desktop

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'frontend/**'
      - '.github/workflows/desktop.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Dipendenze Linux per Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Genera icone dal logo approvato
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@^2 icon app-icon.png

      - name: Build desktop (frontend + bundle Tauri)
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@^2 build

      - name: Smoke test - avvio e render su Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick x11-utils
          APPIMAGE=$(readlink -f "$(ls desktop/target/release/bundle/appimage/*.AppImage | head -1)")
          chmod +x "$APPIMAGE"
          cd /tmp && "$APPIMAGE" --appimage-extract >/dev/null
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          DISPLAY=:99 WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 NO_AT_BRIDGE=1 GDK_BACKEND=x11 /tmp/squashfs-root/AppRun > /tmp/atlas-app.log 2>&1 &
          APP_PID=$!
          echo "--- attesa finestra ATLAS (max 40s):"
          FOUND=0
          for i in $(seq 1 20); do
            if DISPLAY=:99 xwininfo -root -children | grep -i atlas; then FOUND=1; break; fi
            sleep 2
          done
          if [ "$FOUND" != "1" ]; then
            echo "ERRORE: nessuna finestra ATLAS dopo 40s - app non avviata"
            echo "--- log app:"; cat /tmp/atlas-app.log
            kill $APP_PID 2>/dev/null || true
            exit 1
          fi
          echo "--- finestra trovata, attesa render (10s)"
          sleep 10
          DISPLAY=:99 import -window root /tmp/atlas-desktop-smoke.png
          STATS=$(identify -format "mean=%[mean] stddev=%[standard-deviation] size=%wx%h" /tmp/atlas-desktop-smoke.png)
          echo "--- statistiche pixel: $STATS"
          STDDEV=$(echo "$STATS" | sed -E 's/.*stddev=([0-9.]+).*/\1/')
          {
            echo "finestra ATLAS: trovata"
            echo "pixel: $STATS"
            echo "--- log app (prime 40 righe):"
            head -40 /tmp/atlas-app.log
          } > /tmp/atlas-desktop-smoke.log
          kill $APP_PID || true
          awk -v s="$STDDEV" 'BEGIN{ if (s+0 < 1.0) { print "ERRORE: screenshot vuoto/uniforme (stddev=" s ") - render non dimostrato"; exit 1 } }'
          echo "OK: render dimostrato (stddev=$STDDEV)"

      - name: Salva lo screenshot smoke in docs/ (evidenza render nel repo)
        if: runner.os == 'Linux'
        run: |
          mkdir -p docs/assets
          cp /tmp/atlas-desktop-smoke.png docs/assets/desktop-smoke-linux.png
          cp /tmp/atlas-desktop-smoke.log docs/assets/desktop-smoke-log.txt
          git config user.name "atlas-ci"
          git config user.email "ci@fredrichlabs.invalid"
          git add docs/assets/desktop-smoke-linux.png docs/assets/desktop-smoke-log.txt
          git commit -m "ci: screenshot smoke desktop (render Xvfb) [skip ci]" || echo "nessuna modifica"
          git push

      - name: Artifact smoke screenshot
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-desktop-smoke-linux
          path: /tmp/atlas-desktop-smoke.png
          if-no-files-found: error

      - name: Artifact Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-desktop-linux
          path: |
            desktop/target/release/bundle/deb/*.deb
            desktop/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

      - name: Artifact macOS
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-desktop-macos
          path: desktop/target/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
