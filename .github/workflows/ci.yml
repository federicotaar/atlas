name: CI

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ATLAS_DATABASE_URL: postgresql+psycopg://atlas:atlas@localhost:5432/atlas_test
      ATLAS_EMBED_PROVIDER: local
      ATLAS_LLM_PROVIDER: extractive
      ATLAS_JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install "./backend[dev]"
      - name: Ruff
        run: ruff check backend/app backend/tests
      - name: Pytest
        working-directory: backend
        run: pytest -q
      - name: Migrazioni (upgrade/downgrade/upgrade su db pulito)
        working-directory: backend
        run: |
          PGPASSWORD=atlas psql -h localhost -U atlas -d postgres -c 'CREATE DATABASE atlas_mig'
          ATLAS_DATABASE_URL=postgresql+psycopg://atlas:atlas@localhost:5432/atlas_mig alembic upgrade head
          ATLAS_DATABASE_URL=postgresql+psycopg://atlas:atlas@localhost:5432/atlas_mig alembic downgrade base
          ATLAS_DATABASE_URL=postgresql+psycopg://atlas:atlas@localhost:5432/atlas_mig alembic upgrade head
      - name: Benchmark di recupero
        run: |
          PGPASSWORD=atlas psql -h localhost -U atlas -d postgres -c 'CREATE DATABASE atlas_bench'
          python scripts/benchmark.py

  ollama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install "./backend[dev]"
      - name: Installa Ollama
        run: |
          # install.sh di ollama.com punta a un asset .tgz non piu' pubblicato
          # (404) e i browser_download_url dei Releases riescono 504:
          # scarichiamo l'asset via endpoint API di GitHub (verificato attivo).
          # Anche la risoluzione dell'asset va ripetuta: api.github.com puo'
          # rispondere 503 transitorio (visto nel run 42473097331).
          ASSET_URL=""
          for i in 1 2 3 4; do
            ASSET_URL=$(curl -fsSL https://api.github.com/repos/ollama/ollama/releases/latest | python3 -c "import sys,json; d=json.load(sys.stdin); print(next(a['url'] for a in d['assets'] if a['name']=='ollama-linux-amd64.tar.zst'))") && [ -n "$ASSET_URL" ] && break
            echo "risoluzione release ollama fallita (tentativo $i), riprovo..."
            sleep 15
          done
          [ -n "$ASSET_URL" ]
          ok=0
          for i in 1 2 3; do
            if curl -fsSL --retry 3 -H 'Accept: application/octet-stream' "$ASSET_URL" -o /tmp/ollama.tar.zst; then
              sudo tar -I zstd -xf /tmp/ollama.tar.zst -C /usr/local && ok=1 && break
            fi
            echo "download tarball fallito (tentativo $i), riprovo..."
            sleep 10
          done
          [ "$ok" = 1 ]
          command -v ollama
      - name: Server + modelli
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 3
          ollama pull nomic-embed-text
          ollama pull smollm2:135m
      - name: Verifica genuina provider Ollama (embeddings + generazione)
        run: ATLAS_OLLAMA_LLM_MODEL=smollm2:135m python scripts/check_ollama.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q

# fase 4: trigger CI dopo import bot
# nota fase 5 (trigger run)
# nota fase 6 (trigger run)

# trigger: desktop wrapper + CORS (2026-11-07)

  desktop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Dipendenze di sistema Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf xvfb openbox libxdo-dev libayatana-appindicator3-dev
      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Build sidecar backend (PyInstaller onefile)
        run: bash backend/scripts/build_sidecar.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: wa-bridge/go.mod
      - name: Build sidecar wa-bridge (WhatsApp, statico)
        run: |
          cd wa-bridge
          CGO_ENABLED=0 go build -ldflags='-s -w' -o ../desktop/bin/wa-bridge-x86_64-unknown-linux-gnu .
      - name: Verifica bridge WhatsApp bundled (risoluzione + lifecycle, nessun account)
        run: |
          set -e
          BRIDGE=$(ls desktop/bin/wa-bridge-* | head -1)
          test -x "$BRIDGE" || { echo 'wa-bridge bundled non trovato in desktop/bin'; exit 1; }
          # 1) lifecycle standalone del binario nel layout del bundle:
          #    healthz con token, 401 senza, linked=false senza account,
          #    boot id diverso al riavvio. Nessuna rete verso WhatsApp.
          "$BRIDGE" -addr 127.0.0.1:18741 -token ci-token -db /tmp/wa-ci-session.db > /tmp/wa-bridge.log 2>&1 &
          BPID=$!
          R=""
          for i in $(seq 1 20); do
            sleep 1
            R=$(curl -s -H 'X-Bridge-Token: ci-token' http://127.0.0.1:18741/healthz || true)
            echo "$R" | grep -q '"ok":true' && break
          done
          echo "$R" | grep -q '"ok":true' || { echo 'healthz bridge FALLITO'; cat /tmp/wa-bridge.log; kill -9 $BPID 2>/dev/null || true; exit 1; }
          echo "$R" | grep -q '"linked":false' || { echo "bridge linked senza account: $R"; kill -9 $BPID 2>/dev/null || true; exit 1; }
          BOOT1=$(echo "$R" | grep -o '"boot":"[^"]*"' || true)
          test -n "$BOOT1" || { echo 'boot id mancante in healthz'; kill -9 $BPID 2>/dev/null || true; exit 1; }
          C=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18741/healthz)
          [ "$C" = 401 ] || { echo "healthz senza token: $C (atteso 401)"; kill -9 $BPID 2>/dev/null || true; exit 1; }
          kill $BPID 2>/dev/null || true; wait $BPID 2>/dev/null || true
          "$BRIDGE" -addr 127.0.0.1:18741 -token ci-token -db /tmp/wa-ci-session.db >> /tmp/wa-bridge.log 2>&1 &
          BPID=$!
          R2=""
          for i in $(seq 1 20); do
            sleep 1
            R2=$(curl -s -H 'X-Bridge-Token: ci-token' http://127.0.0.1:18741/healthz || true)
            echo "$R2" | grep -q '"ok":true' && break
          done
          BOOT2=$(echo "$R2" | grep -o '"boot":"[^"]*"' || true)
          [ -n "$BOOT2" ] && [ "$BOOT1" != "$BOOT2" ] || { echo "boot id non cambia al riavvio: $BOOT1 vs $BOOT2"; kill -9 $BPID 2>/dev/null || true; exit 1; }
          kill $BPID 2>/dev/null || true; wait $BPID 2>/dev/null || true
          # 2) risoluzione Python: il backend del bundle (stesso dir del
          #    bridge) lo risolve e lo dichiara disponibile via API
          #    autenticata. Nessuno spawn, nessun pairing.
          export ATLAS_DESKTOP_DATA_DIR=/tmp/atlas-ci-wa
          SIDECAR=$(ls desktop/bin/atlas-backend-* | head -1)
          "$SIDECAR" > /tmp/sidecar-wa.log 2>&1 &
          SPID=$!
          for i in $(seq 1 45); do
            sleep 1
            curl -s http://127.0.0.1:8000/health | grep -q '"app":"atlas"' && break
          done
          TOK=$(curl -s -X POST http://127.0.0.1:8000/auth/register -H 'content-type: application/json' -d '{"email":"wa-ci@example.com","password":"password-ci-wa"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          ST=$(curl -s http://127.0.0.1:8000/connectors/whatsapp/status -H "Authorization: Bearer $TOK")
          echo "status: $ST"
          echo "$ST" | grep -q '"bridge_available":true' || { echo 'bridge NON risolto dal backend bundled'; head -20 /tmp/sidecar-wa.log; kill -9 $SPID 2>/dev/null || true; exit 1; }
          kill -9 $SPID 2>/dev/null || true
          pkill -9 -f 'atlas-backend' 2>/dev/null || true
          for i in $(seq 1 15); do
            sleep 1
            curl -s http://127.0.0.1:8000/health >/dev/null 2>&1 || break
          done
          echo 'bridge bundled: lifecycle + risoluzione Python OK'
      - name: Genera icone Tauri dal logo
        run: npx --yes @tauri-apps/cli@2 icon desktop/app-icon.png -o desktop/icons
      - name: Build app desktop (Tauri)
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --no-bundle
      - name: "E2E porta di riserva: vecchia API 2.0.x su 8000 intoccata"
        run: bash scripts/e2e_reserve_port.sh
      - name: Lancio reale dell'app e verifica backend sidecar
        run: |
          set -e
          ss -ltnp 2>/dev/null | grep ':8000' || echo 'porta 8000 libera'
          export ATLAS_DESKTOP_DATA_DIR=/tmp/atlas-ci-direct
          SIDECAR=$(ls desktop/bin/atlas-backend-* | head -1)
          "$SIDECAR" > /tmp/sidecar-direct.log 2>&1 &
          DPID=$!
          direct=0
          for i in $(seq 1 45); do
            sleep 1
            if curl -s http://127.0.0.1:8000/health | grep -q '"app":"atlas"'; then direct=1; break; fi
          done
          echo "sidecar diretto: $([ $direct = 1 ] && echo OK || echo FALLITO)"
          head -15 /tmp/sidecar-direct.log || true
          kill -9 $DPID 2>/dev/null || true
          pkill -9 -f 'atlas-backend' 2>/dev/null || true
          for i in $(seq 1 15); do
            sleep 1
            curl -s http://127.0.0.1:8000/health >/dev/null 2>&1 || break
          done
          if ss -ltnp 2>/dev/null | grep -q ':8000'; then
            echo 'porta 8000 ancora occupata dopo pulizia' >&2
            exit 1
          fi
          Xvfb :99 -screen 0 1280x800x24 > /tmp/xvfb.log 2>&1 &
          sleep 2
          # Window manager reale: senza WM, Xvfb nudo non riattiva la finestra
          # (_NET_ACTIVE_WINDOW non supportato) e gli screenshot post-riavvio
          # restano neri. openbox rende windowactivate/repaint onesti.
          DISPLAY=:99 openbox > /tmp/openbox.log 2>&1 &
          sleep 2
          DISPLAY=:99 ./desktop/target/release/atlas-desktop > /tmp/atlas-desktop.log 2>&1 &
          ok=0
          for i in $(seq 1 90); do
            sleep 1
            BODY=$(curl -s http://127.0.0.1:8000/health || true)
            if echo "$BODY" | grep -q '"app":"atlas"'; then
              echo "backend sidecar attivo dall'app: $BODY"
              ok=1
              break
            fi
          done
          if [ "$ok" != "1" ]; then
            echo "backend non avviato dall'app desktop" >&2
            ps aux | grep -i atlas | grep -v grep >&2 || true
            tail -50 /tmp/atlas-desktop.log >&2 || true
            exit 1
          fi
      - name: Cattura screenshot app in esecuzione
        run: |
          sleep 6
          sudo apt-get install -y imagemagick xdotool >/dev/null
          DISPLAY=:99 import -window root /tmp/atlas-screenshot.png
          DISPLAY=:99 xdotool search --name 'ATLAS|atlas' 2>/dev/null && echo 'finestra app presente' || echo 'nessuna finestra trovata'
      - name: Ollama per roundtrip riuscito nell'app impacchettata
        run: |
          # Stessa installazione del job ollama (asset via API GitHub):
          # il click-through E2E imposta smollm2:135m DALLA PAGINA dell'agente
          # e prova un roundtrip di successo nell'app impacchettata, senza
          # segreti in CI (provider locale, nessuna chiave).
          ASSET_URL=""
          for i in 1 2 3 4; do
            ASSET_URL=$(curl -fsSL https://api.github.com/repos/ollama/ollama/releases/latest | python3 -c "import sys,json; d=json.load(sys.stdin); print(next(a['url'] for a in d['assets'] if a['name']=='ollama-linux-amd64.tar.zst'))") && [ -n "$ASSET_URL" ] && break
            echo "risoluzione release ollama fallita (tentativo $i), riprovo..."
            sleep 15
          done
          [ -n "$ASSET_URL" ]
          ok=0
          for i in 1 2 3; do
            if curl -fsSL --retry 3 -H 'Accept: application/octet-stream' "$ASSET_URL" -o /tmp/ollama.tar.zst; then
              sudo tar -I zstd -xf /tmp/ollama.tar.zst -C /usr/local && ok=1 && break
            fi
            echo "download tarball fallito (tentativo $i), riprovo..."
            sleep 10
          done
          [ "$ok" = 1 ]
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 3
          ollama pull smollm2:135m
      - name: "E2E UI reale: registrazione, memoria, riavvio"
        run: bash scripts/e2e_ui.sh
      - name: Carica artefatto screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-screenshot
          path: |
            /tmp/atlas-screenshot.png
            /tmp/e2e-*.png
            /tmp/reserve-*.png
          if-no-files-found: warn
      - name: Pubblica screenshot su branch ci-artifacts
        if: always()
        run: |
          if [ ! -f /tmp/atlas-screenshot.png ]; then echo 'nessuno screenshot da pubblicare'; exit 0; fi
          git config user.email "ci@atlas.local"
          git config user.name "atlas-ci"
          # Ogni run scrive nella SUA directory runs/<id>/ (artefatto legato
          # in modo univoco al commit) e aggiorna la copia "latest" in root.
          # Push NON forzato con retry: due run concorrenti non si
          # sovrascrivono piu' gli screenshot a vicenda.
          for attempt in 1 2 3; do
            if git fetch origin ci-artifacts; then
              git checkout -B ci-artifacts-local origin/ci-artifacts
            else
              git checkout --orphan ci-artifacts-local
              git rm -rf . >/dev/null 2>&1 || true
            fi
            mkdir -p "runs/$GITHUB_RUN_ID"
            cp /tmp/atlas-screenshot.png "runs/$GITHUB_RUN_ID/atlas-screenshot.png"
            cp /tmp/atlas-screenshot.png atlas-screenshot.png
            for f in /tmp/e2e-*.png; do
              [ -e "$f" ] || continue
              cp "$f" "runs/$GITHUB_RUN_ID/"
              cp "$f" .
            done
            git add -A '*.png'
            git commit -q -m "ci: screenshot app desktop (run $GITHUB_RUN_ID) [skip ci]" || true
            if git push origin HEAD:refs/heads/ci-artifacts; then
              echo "screenshot pubblicati in ci-artifacts/runs/$GITHUB_RUN_ID/"
              break
            fi
            echo "push rifiutato (run concorrente): riprovo ($attempt/3)"
          done
