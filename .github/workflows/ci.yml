name: CI

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ATLAS_DATABASE_URL: postgresql+psycopg://atlas:atlas@localhost:5432/atlas_test
      ATLAS_EMBED_PROVIDER: local
      ATLAS_LLM_PROVIDER: extractive
      ATLAS_JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install "./backend[dev]"
      - name: Ruff
        run: ruff check backend/app backend/tests
      - name: Pytest
        working-directory: backend
        run: pytest -q
      - name: Migrazioni (upgrade/downgrade/upgrade su db pulito)
        working-directory: backend
        run: |
          PGPASSWORD=atlas psql -h localhost -U atlas -d postgres -c 'CREATE DATABASE atlas_mig'
          ATLAS_DATABASE_URL=postgresql+psycopg://atlas:atlas@localhost:5432/atlas_mig alembic upgrade head
          ATLAS_DATABASE_URL=postgresql+psycopg://atlas:atlas@localhost:5432/atlas_mig alembic downgrade base
          ATLAS_DATABASE_URL=postgresql+psycopg://atlas:atlas@localhost:5432/atlas_mig alembic upgrade head
      - name: Benchmark di recupero
        run: |
          PGPASSWORD=atlas psql -h localhost -U atlas -d postgres -c 'CREATE DATABASE atlas_bench'
          python scripts/benchmark.py

  ollama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install "./backend[dev]"
      - name: Installa Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Server + modelli
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 3
          ollama pull nomic-embed-text
          ollama pull smollm2:135m
      - name: Verifica genuina provider Ollama (embeddings + generazione)
        run: ATLAS_OLLAMA_LLM_MODEL=smollm2:135m python scripts/check_ollama.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q

# fase 4: trigger CI dopo import bot
# nota fase 5 (trigger run)
# nota fase 6 (trigger run)

# trigger: desktop wrapper + CORS (2026-11-07)

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Dipendenze di sistema Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf xvfb libxdo-dev libayatana-appindicator3-dev
      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Build sidecar backend (PyInstaller onefile)
        run: bash backend/scripts/build_sidecar.sh
      - name: Genera icone Tauri dal logo
        run: npx --yes @tauri-apps/cli@2 icon desktop/app-icon.png -o desktop/icons
      - name: Build app desktop (Tauri)
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --no-bundle
      - name: Lancio reale dell'app e verifica backend sidecar
        run: |
          set -e
          ss -ltnp 2>/dev/null | grep ':8000' || echo 'porta 8000 libera'
          export ATLAS_DESKTOP_DATA_DIR=/tmp/atlas-ci-direct
          SIDECAR=$(ls desktop/bin/atlas-backend-* | head -1)
          "$SIDECAR" > /tmp/sidecar-direct.log 2>&1 &
          DPID=$!
          direct=0
          for i in $(seq 1 45); do
            sleep 1
            if curl -s http://127.0.0.1:8000/health | grep -q '"app":"atlas"'; then direct=1; break; fi
          done
          echo "sidecar diretto: $([ $direct = 1 ] && echo OK || echo FALLITO)"
          head -15 /tmp/sidecar-direct.log || true
          kill -9 $DPID 2>/dev/null || true
          pkill -9 -f 'atlas-backend' 2>/dev/null || true
          for i in $(seq 1 15); do
            sleep 1
            curl -s http://127.0.0.1:8000/health >/dev/null 2>&1 || break
          done
          if ss -ltnp 2>/dev/null | grep -q ':8000'; then
            echo 'porta 8000 ancora occupata dopo pulizia' >&2
            exit 1
          fi
          xvfb-run -a ./desktop/target/release/atlas-desktop > /tmp/atlas-desktop.log 2>&1 &
          ok=0
          for i in $(seq 1 90); do
            sleep 1
            BODY=$(curl -s http://127.0.0.1:8000/health || true)
            if echo "$BODY" | grep -q '"app":"atlas"'; then
              echo "backend sidecar attivo dall'app: $BODY"
              ok=1
              break
            fi
          done
          if [ "$ok" != "1" ]; then
            echo "backend non avviato dall'app desktop" >&2
            ps aux | grep -i atlas | grep -v grep >&2 || true
            tail -50 /tmp/atlas-desktop.log >&2 || true
            exit 1
          fi
      - name: Cattura screenshot app in esecuzione
        run: |
          sleep 3
          sudo apt-get install -y imagemagick xdotool >/dev/null
          DISPLAY=:99 import -window root /tmp/atlas-screenshot.png
          DISPLAY=:99 xdotool search --name 'ATLAS|atlas' 2>/dev/null && echo 'finestra app presente' || echo 'nessuna finestra trovata'
      - name: Carica artefatto screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-screenshot
          path: /tmp/atlas-screenshot.png
          if-no-files-found: warn
