name: auth-test

# Branch di test isolato per l'auth a codici email (arc B).
# NON e' il default branch: niente release, niente deploy, niente invii reali.
on:
  push:
    branches: [test/auth-codes-ci]
  workflow_dispatch:

jobs:
  worker-battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Batteria worker (14+12 casi + fail-closed Turnstile)
        run: bash codes-worker/test/run-battery.sh

  webkitgtk-auth-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dipendenze WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 gir1.2-gtk-3.0 xvfb openbox dbus-x11
      - name: Build frontend (dummy sitekey Cloudflare ESPLICITA per E2E)
        run: |
          npm ci --prefix frontend
          VITE_TURNSTILE_SITEKEY=1x00000000000000000000AA npm run build --prefix frontend
      - name: Mock API + preview + flusso signup in WebKitGTK reale
        run: |
          python3 scripts/mock_api.py &
          # --host 127.0.0.1: senza, vite si lega a localhost che sul runner
          # risolve ::1 (IPv6) e le richieste su 127.0.0.1 vanno in refused.
          (cd frontend && npx vite preview --port 4173 --strictPort --host 127.0.0.1) &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:4173/ && curl -sf -o /dev/null -X POST http://127.0.0.1:8000/ask; then break; fi
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:4173/
          dbus-run-session -- bash -c 'Xvfb :99 -screen 0 1280x800x24 & sleep 2; DISPLAY=:99 openbox & sleep 2; DISPLAY=:99 python3 scripts/webkit_auth_flow.py'
