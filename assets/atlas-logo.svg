<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- ATLAS logo v7 (sorgente vettoriale approssimata; il PNG e la versione di riferimento).
       A bold bianca, orbita inclinata -25 con spazio nero dove incontra la lettera,
       punto lime sull'arco in alto a destra. -->
  <rect width="1024" height="1024" rx="229" fill="#000"/>
  <g transform="rotate(-25 512 512)">
    <ellipse cx="512" cy="512" rx="360" ry="132" fill="none" stroke="#fff" stroke-width="12"/>
    <circle cx="718.7" cy="404.1" r="34" fill="#A3E635"/>
  </g>
  <text x="512" y="526" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-weight="bold"
        font-size="545" fill="#fff" text-anchor="middle" dominant-baseline="central">A</text>
</svg>
