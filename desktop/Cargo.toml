[package]
name = "atlas-desktop"
version = "2.1.0"
edition = "2021"

[lib]
name = "atlas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
ureq = { version = "2", default-features = false, features = ["json"] }
serde_json = "1"
